<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Resumen Semanal de Actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* --- ESTILOS BASE --- */
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --warning-color: #f39c12;
            --success-color: #2ecc71;
            --dark-color: #34495e;
            --text-color: #333;
            --border-color: #ddd;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
            --light-yellow: #fff9e6;
            --insumos-primary: #3f7b57;
            --insumos-accent: #2196F3;
            --insumos-light-gray: #f0f2f5;
            --insumos-danger: #ef5350;
            --diario-color: #A6D5FA;
            --semanal-color: #FFC0CB;
        }

        html, body {
            touch-action: manipulation;
            overflow-x: hidden;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--insumos-light-gray);
            color: var(--dark-color);
            line-height: 1.6;
            -webkit-user-scalable: no;
            -moz-user-scalable: no;
            -ms-user-scalable: no;
            user-scalable: no;
        }

        * {
            touch-action: pan-x pan-y;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--dark-color));
            color: white;
            text-align: center;
            padding: 18px 0;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 100;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 1.8rem;
            position: relative;
            padding-bottom: 10px;
            font-weight: bold;
        }

        h1:after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background-color: var(--secondary-color);
            border-radius: 2px;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
            position: relative;
            z-index: 1;
        }

        .card {
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: none;
            margin-bottom: 25px;
            border-top: 5px solid var(--insumos-primary);
        }

        .card-body {
            padding: 2.5rem;
        }

        .tab-title {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 30px;
            padding: 20px 0;
            position: relative;
        }

        .tab-title h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            display: inline-block;
            padding: 0 25px;
            position: relative;
        }

        .tab-title h2:after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(135deg, var(--secondary-color), var(--primary-color));
            border-radius: 2px;
        }

        .tab-title h2:before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 1px;
            background-color: var(--border-color);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
        }

        .form-label {
            font-weight: 600;
            color: var(--dark-color);
            margin-bottom: 8px;
        }

        .question-container {
            background-color: #fdfdfd;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid var(--secondary-color);
            transition: border-color 0.3s;
        }

        .question-container:hover {
            border-color: var(--secondary-color);
        }

        .question-container label {
            font-weight: 600;
            color: var(--dark-color);
        }

        /* Estilos de tabla */
        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            background: white;
        }

        .table {
            margin-bottom: 0;
            font-size: 0.9rem;
        }

        .table th {
            background-color: #f4f4f4;
            font-weight: 600;
            color: var(--dark-color);
            border-color: #dee2e6;
            text-align: center;
            padding: 12px 8px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .table td {
            padding: 10px 8px;
            border-color: #dee2e6;
            vertical-align: middle;
            text-align: center;
        }

        .table td:first-child {
            text-align: left;
            font-weight: 500;
        }

        .completada {
            background-color: #d4edda !important;
            color: #155724;
        }

        .pendiente {
            background-color: #f8d7da !important;
            color: #721c24;
        }

        .completada i {
            color: #28a745;
        }

        .pendiente i {
            color: #dc3545;
        }

        /* Estilo para la simbología */
        .simbologia {
            margin: 20px 0;
            font-size: 14px;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .simbologia div {
            padding: 6px 15px;
            border-radius: 50px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .simbologia .completada {
            background-color: #d4edda;
            color: #155724;
        }

        .simbologia .pendiente {
            background-color: #f8d7da;
            color: #721c24;
        }

        /* Información de la semana */
        .semana-info {
            margin: 15px 0 25px 0;
            padding: 15px;
            background: linear-gradient(135deg, #e8f4fd, #d1ecf9);
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            color: var(--primary-color);
            border-left: 4px solid var(--secondary-color);
        }

        .semana-info i {
            margin-right: 10px;
            color: var(--secondary-color);
        }

        .no-data {
            text-align: center;
            color: #6c757d;
            padding: 40px 20px;
        }

        .no-data i {
            font-size: 3rem;
            color: #dee2e6;
            margin-bottom: 15px;
            display: block;
        }

        /* Overlay de carga */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(52, 152, 219, 0.2);
            border-radius: 50%;
            border-top-color: var(--secondary-color);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loadingMessage {
            text-align: center;
            color: var(--dark-color);
        }

        #loadingMessage h4 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: bold;
        }

        /* Estilos de mensajes SweetAlert2 */
        .swal2-popup {
            border-radius: 12px !important;
            padding: 25px !important;
        }

        .swal2-actions {
            gap: 12px !important;
        }

        .swal2-confirm {
            border-radius: 50px !important;
            padding: 10px 30px !important;
            font-weight: 600 !important;
            min-width: 120px !important;
        }

        .swal2-cancel {
            border-radius: 50px !important;
            padding: 10px 30px !important;
            font-weight: 600 !important;
            min-width: 120px !important;
        }

        /* Estilos para los días de la semana en el encabezado */
        .dia-header {
            display: block;
            font-size: 0.75rem;
            color: #6c757d;
            font-weight: 400;
        }

        .dia-header .dia-numero {
            font-size: 1rem;
            font-weight: 700;
            color: var(--dark-color);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .card-body {
                padding: 1.5rem;
            }

            .table {
                font-size: 0.75rem;
            }

            .table th {
                padding: 8px 4px;
            }

            .table td {
                padding: 6px 4px;
            }

            .simbologia {
                gap: 10px;
                font-size: 12px;
            }

            .simbologia div {
                padding: 4px 12px;
            }

            .semana-info {
                font-size: 0.85rem;
                padding: 12px;
            }

            .question-container {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .header {
                font-size: 1.2rem;
                padding: 12px 0;
            }

            h1 {
                font-size: 1.3rem;
            }

            .container {
                margin: 10px auto;
                padding: 0 10px;
            }

            .card-body {
                padding: 1rem;
            }

            .tab-title h2 {
                font-size: 1.2rem;
                padding: 0 15px;
            }

            .table {
                font-size: 0.65rem;
            }

            .table th {
                padding: 6px 2px;
            }

            .table td {
                padding: 4px 2px;
            }

            .semana-info {
                font-size: 0.75rem;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">Pisos Brillantes</div>

    <div class="container">
        <h1>Resumen Semanal de Actividades</h1>

        <div class="card">
            <div class="card-body">
                <form id="consultaForm">
                    <div class="tab-title">
                        <h2>Filtros de Búsqueda</h2>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <div class="question-container">
                                <label for="fechaConsulta" class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="fechaConsulta" required>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="question-container">
                                <label for="tipoConsulta" class="form-label">Tipo de Actividad</label>
                                <select class="form-select" id="tipoConsulta" required>
                                    <option value="">Selecciona una opción</option>
                                    <option value="Área">Área</option>
                                    <option value="Baño">Baño</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </form>

                <div class="simbologia">
                    <div class="completada"><i class="fas fa-check-circle"></i> Completada</div>
                    <div class="pendiente"><i class="fas fa-times-circle"></i> Pendiente</div>
                </div>

                <div id="semanaInfo" class="semana-info" style="display: none;"></div>

                <div class="table-container">
                    <div id="resultadoConsulta">
                        <div class="no-data">
                            <i class="fas fa-search"></i>
                            <p>Seleccione una fecha y tipo de actividad para ver el resumen semanal</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Overlay de carga -->
    <div id="overlay">
        <div class="spinner"></div>
        <div id="loadingMessage">
            <h4>Por favor espera un momento...</h4>
        </div>
    </div>

    <script>
        // URL de tu Google Apps Script desplegado
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxrSY_nR4o4DUXzmfkrIriC6vtIm6oXMab1yBtl9zHxC8-qTmP3Izfyyi8VMYXo8seKgQ/exec";
        
        // Variables globales
        let $fechaInput, $tipoSelect;

        // Precargar la fecha actual al cargar la página
        function prellenarFecha() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, "0");
            const day = String(today.getDate()).padStart(2, "0");
            $fechaInput.val(`${year}-${month}-${day}`);
        }

        // Función para obtener los días de la semana (Lunes a Domingo)
        function getWeekDays(selectedDate) {
            const date = new Date(selectedDate);
            const dayOfWeek = date.getDay();
            
            const monday = new Date(date);
            if (dayOfWeek === 0) {
                monday.setDate(date.getDate() + 1);
            } else if (dayOfWeek !== 1) {
                monday.setDate(date.getDate() - (dayOfWeek - 1));
            }
            
            const weekDays = [new Date(monday)];
            for (let i = 1; i < 7; i++) {
                const nextDay = new Date(monday);
                nextDay.setDate(monday.getDate() + i);
                weekDays.push(nextDay);
            }
            
            return weekDays;
        }

        // Función para obtener el número de semana ISO
        function getWeekNumber(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
            const week1 = new Date(d.getFullYear(), 0, 4);
            return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
        }

        // Formatear fecha como DD/MM/YYYY
        function formatDate(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        // Formatear fecha como DD/MM para mostrar
        function formatDateShort(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            return `${day}/${month}`;
        }

        // Función principal para consultar datos
        async function consultarDatos() {
            const fecha = $fechaInput.val();
            const tipo = $tipoSelect.val();

            // Validar campos
            if (!fecha || !tipo) {
                return;
            }

            // Mostrar overlay de carga
            mostrarOverlay();

            try {
                // Realizar la consulta al servidor
                const response = await fetch(`${SCRIPT_URL}?fecha=${encodeURIComponent(fecha)}&tipo=${encodeURIComponent(tipo)}`);
                
                if (!response.ok) {
                    throw new Error(`Error en la consulta: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.message);
                }
                
                // Mostrar información de la semana
                const weekDays = getWeekDays(new Date(fecha));
                const $semanaInfo = $('#semanaInfo');
                $semanaInfo.html(`
                    <i class="fas fa-calendar-week"></i> Semana ${getWeekNumber(new Date(fecha))} del año: 
                    ${formatDateShort(weekDays[0])} (Lun) al ${formatDateShort(weekDays[6])} (Dom)
                `).show();
                
                // Generar tabla con los resultados
                generarTablaResumen(tipo, data.datos, weekDays);
                
            } catch (error) {
                console.error("Error al consultar datos:", error);
                
                Swal.fire({
                    text: "No se pudieron cargar los datos. Verifica tu conexión.",
                    icon: "error",
                    confirmButtonText: "Aceptar",
                    confirmButtonColor: "#e74c3c"
                });
                
                // Limpiar resultados en caso de error
                $('#resultadoConsulta').html(`
                    <div class="no-data">
                        <i class="fas fa-exclamation-triangle" style="color: #e74c3c;"></i>
                        <p style="color: #e74c3c;">No se pudieron cargar los datos</p>
                    </div>
                `);
                $('#semanaInfo').hide();
            } finally {
                ocultarOverlay();
            }
        }

        // Función para generar la tabla de resultados
        function generarTablaResumen(tipo, datos, weekDays) {
            const $resultado = $('#resultadoConsulta');
            
            // Si no hay datos, mostrar mensaje
            if (!datos || datos.length === 0) {
                $resultado.html(`
                    <div class="no-data">
                        <i class="fas fa-inbox"></i>
                        <p>No se encontraron registros para los criterios seleccionados</p>
                    </div>
                `);
                return;
            }
            
            const diasSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
            
            // Construir tabla
            let html = `<table class="table table-bordered">`;
            
            // Encabezados
            html += `<thead><tr>`;
            html += `<th style="min-width: 120px;">${tipo === "Área" ? "Área" : "Baño"}</th>`;
            
            if (tipo === "Área") {
                html += `<th style="min-width: 100px;">Oficina</th>`;
            }
            
            for (let i = 0; i < 7; i++) {
                const fecha = weekDays[i];
                html += `<th>
                    <span class="dia-header">
                        <span class="dia-numero">${fecha.getDate()}</span>
                        <br>${diasSemana[i]}
                    </span>
                </th>`;
            }
            
            html += `</tr></thead>`;
            
            // Cuerpo
            html += `<tbody>`;
            
            // Ordenar datos
            if (tipo === "Área") {
                datos.sort((a, b) => {
                    if (a.area === "Administración" && b.area !== "Administración") return -1;
                    if (b.area === "Administración" && a.area !== "Administración") return 1;
                    const areaCompare = a.area.localeCompare(b.area);
                    if (areaCompare !== 0) return areaCompare;
                    return (a.oficina || "").localeCompare(b.oficina || "");
                });
            } else {
                datos.sort((a, b) => a.baño.localeCompare(b.baño));
            }
            
            datos.forEach(item => {
                html += `<tr>`;
                html += `<td>${tipo === "Área" ? item.area : item.baño}</td>`;
                
                if (tipo === "Área") {
                    html += `<td>${item.oficina || "-"}</td>`;
                }
                
                for (let i = 0; i < 7; i++) {
                    const dia = item.dias[i];
                    const estado = dia ? dia.estado === "Completada" : false;
                    html += `
                        <td class="${estado ? "completada" : "pendiente"}">
                            <i class="fas fa-${estado ? "check-circle" : "times-circle"}"></i>
                        </td>
                    `;
                }
                
                html += `</tr>`;
            });
            
            html += `</tbody></table>`;
            
            $resultado.html(html);
        }

        // Funciones de overlay
        function mostrarOverlay() {
            document.getElementById('overlay').style.display = 'flex';
        }

        function ocultarOverlay() {
            document.getElementById('overlay').style.display = 'none';
        }

        // Inicializar la página al cargar
        $(document).ready(function() {
            $fechaInput = $('#fechaConsulta');
            $tipoSelect = $('#tipoConsulta');
            
            prellenarFecha();
            
            // Configurar eventos para consultar automáticamente al cambiar los filtros
            $fechaInput.on('change', consultarDatos);
            $tipoSelect.on('change', consultarDatos);
            
            // Realizar consulta inicial si hay valores seleccionados
            if ($fechaInput.val() && $tipoSelect.val()) {
                setTimeout(consultarDatos, 300);
            }
        });
    </script>
</body>
</html>
